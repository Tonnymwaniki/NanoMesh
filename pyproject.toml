[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanomesh"
version = "0.1.0"
description = "AI model optimization and edge deployment platform"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "psutil",
    "pydantic"
]

[project.scripts]
nanomesh = "nanomesh.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanomesh = ["data/*.json", "data/*.txt", "data/*.html"]

[project.optional-dependencies]
dev = ["pytest", "onnx", "onnxruntime"]
onnx = ["onnxruntime"]  # benchmark ONNX vision and embedding models

[tool.pytest.ini_options]
testpaths = ["tests"]
